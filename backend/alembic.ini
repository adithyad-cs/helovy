# Alembic configuration (docs/05 §4, docs/06 §14).
#
# The database URL is never stored here: alembic/env.py reads MIGRATION_DATABASE_URL
# (the ps5_migrator owner role) from the environment, or from the repository-root .env.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
# Revision files are named after their revision ID, for example 0001_identity.py.
file_template = %%(rev)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

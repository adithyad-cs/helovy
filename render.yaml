# HIVE DOCS — Render STAGING Blueprint (docs/DEPLOYMENT_RENDER.md).
#
# Field names and values were checked against Render's published Blueprint JSON schema
# (https://render.com/schema/render.yaml.json) and the Blueprint reference on 24 Nov 2026.
#
# Applying this Blueprint creates PAID Render resources: a Postgres database, a private
# service with a persistent disk and a paid web service (pre-deploy commands, disks and
# private services are not available on free instances). Read the cost and set-up sections
# of docs/DEPLOYMENT_RENDER.md first. Nothing here is a secret:
#   - secrets are `sync: false` (typed into the Render Dashboard), generated by Render
#     (`generateValue`) or referenced from the database (`fromDatabase`);
#   - the SeaweedFS identities file is a Render secret file, never committed.
# The first deploy of the web service is expected to fail until the one-time set-up in the
# guide is done (app database role, bucket, DATABASE_URL and S3 settings).

databases:
  - name: hive-docs-staging-db
    region: singapore
    postgresMajorVersion: "16"
    plan: 0.1c-256mb
    diskSizeGB: 5
    # Render may add a suffix to the database name; the migrations use current_database().
    databaseName: ps5
    # The initial (default) user owns the database and runs the migrations (docs/06 §11).
    # The restricted runtime role ps5_app is created by hand with CREATE ROLE, never as a
    # Render "default credential" (that would replace this user in connection strings).
    user: ps5_migrator
    # No external connections. Add your own IP temporarily for the one-time set-up.
    ipAllowList: []

services:
  # SeaweedFS 4.54 object storage. A private service has no public URL; only its
  # authenticated S3 port is reachable on the private network (see its Dockerfile).
  - type: pserv
    name: hive-docs-staging-storage
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./deploy/render/seaweedfs/Dockerfile
    dockerContext: ./deploy/render/seaweedfs
    numInstances: 1
    autoDeployTrigger: "off"
    disk:
      name: seaweedfs-data
      mountPath: /data
      sizeGB: 10

  # The application: built SPA + FastAPI backend, one instance, one worker process.
  - type: web
    name: hive-docs-staging
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    numInstances: 1
    autoDeployTrigger: "off"
    healthCheckPath: /readyz
    preDeployCommand: alembic -c /app/backend/alembic.ini upgrade head
    envVars:
      - key: APP_ENV
        value: production
      # The service's own https://….onrender.com origin (Render default variable).
      - key: APP_ORIGIN
        fromService:
          name: hive-docs-staging
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # Owner role (ps5_migrator) over the private network, for the pre-deploy migrations.
      - key: MIGRATION_DATABASE_URL
        fromDatabase:
          name: hive-docs-staging-db
          property: connectionString
      # Restricted role: postgresql://ps5_app:<password>@<internal host>:5432/<database>
      - key: DATABASE_URL
        sync: false
      # http://<storage service internal hostname>:8333 (shown on the storage service page).
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: S3_BUCKET
        value: ps5-documents-staging
      - key: S3_ADDRESSING_STYLE
        value: path
      # The app identity of the storage secret file (Read, Write and List on the bucket only).
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: CSRF_SECRET
        generateValue: true
      - key: RENDER_WORKERS
        value: "2"
      - key: RENDER_TIMEOUT_S
        value: "20"
      - key: LOG_LEVEL
        value: INFO
